<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>犬コマンド3Dアプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/loaders/GLTFLoader.js": "./vendor/three/loaders/GLTFLoader.js",
          "three/addons/utils/BufferGeometryUtils.js": "./vendor/three/utils/BufferGeometryUtils.js"
        }
      }
    </script>
    <script type="module" src="./main.js" defer></script>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="scene-canvas"></canvas>
      <div id="bark-bubble" hidden>ワン！</div>
    </div>

    <div id="log-wrapper">
      <button
        id="log-toggle"
        type="button"
        class="log-toggle"
        aria-expanded="false"
        aria-controls="log-content"
      >
        ログ
      </button>
      <div id="log-content" class="is-hidden" aria-hidden="true">
        <h2 class="log-title">解析ログ</h2>
        <section class="log-block">
          <h3>コマンドJSON</h3>
          <pre id="command-json">[]</pre>
        </section>
        <section class="log-block">
          <h3>解決経路</h3>
          <ul id="command-origins"></ul>
        </section>
      </div>
    </div>

    <div class="input-bar" id="input-bar">
      <div class="status-hud" aria-live="polite">
        <span class="status-hud__label">現在のアクション</span>
        <div class="status-hud__body">
          <p id="current-action">未実行</p>
          <p id="parser-message"></p>
        </div>
      </div>
      <form id="command-form" autocomplete="off">
        <label for="command-input" class="sr-only">犬への指令</label>
        <div class="input-row">
          <input
            id="command-input"
            name="command"
            type="text"
            placeholder="例: ボールまで走って"
            required
          />
          <button type="submit" class="primary">送信</button>
        </div>
      </form>
      <div class="input-bar__footer">
        <div class="examples">
          <span>例文:</span>
          <button data-example="ボールまで走って">ボールまで走って</button>
          <button data-example="こっちに来て、おすわりして">こっちに来て、おすわりして</button>
          <button data-example="しっぽを振って、吠えて">しっぽを振って、吠えて</button>
          <button data-example="餌の器まで歩いて">餌の器まで歩いて</button>
        </div>
        <div class="queue-actions">
          <button id="clear-queue" type="button">実行中のコマンドを停止</button>
          <span id="queue-status">待機中</span>
        </div>
      </div>
    </div>
  </body>
</html>
