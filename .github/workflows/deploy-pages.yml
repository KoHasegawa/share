name: Deploy Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sand-footprint-sim/package-lock.json

      - name: Build sand-footprint-sim (Vite)
        run: |
          cd sand-footprint-sim
          npm ci
          npm run build

      - name: Assemble deploy directory
        run: |
          mkdir -p _deploy
          cp index.html _deploy/
          cp -r sand-footprint-sim/dist _deploy/sand-footprint-sim
          cp -r game _deploy/game
          cp -r game-v2 _deploy/game-v2
          cp -r game-v3 _deploy/game-v3
          cp -r game-v4 _deploy/game-v4
          cp -r game-v5 _deploy/game-v5
          cp -r game-v6 _deploy/game-v6
          cp -r attention-trainer _deploy/attention-trainer
          cp -r parallel-trainer _deploy/parallel-trainer
          # 犬アクション3D: フロントエンド(public/)を静的配信。
          # /api/parse(LLM)はNodeサーバが必要なため、公開版はルール解析のみ動作する。
          cp -r dog-3d-app/public _deploy/dog-3d-app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
