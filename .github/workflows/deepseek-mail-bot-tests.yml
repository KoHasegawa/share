name: DeepSeek mail bot tests

on:
  push:
    paths:
      - 'deepseek-mail-bot/**'
      - '.github/workflows/deepseek-mail-bot-tests.yml'
  pull_request:
    paths:
      - 'deepseek-mail-bot/**'
      - '.github/workflows/deepseek-mail-bot-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deepseek-mail-bot/requirements.txt

      - name: 依存関係をインストール
        run: pip install -r deepseek-mail-bot/requirements.txt

      # テストは外部サービスに接続しない（IMAP / SMTP / DeepSeek はすべてスタブ）。
      - name: テストを実行
        working-directory: deepseek-mail-bot
        run: python -m unittest discover -s tests -t . -v
